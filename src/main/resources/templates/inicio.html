<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SmartPlant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        body {
            background-image: url("https://i.pinimg.com/originals/5a/f8/5b/5af85b01d8b9e91dd1c32162952929fd.gif");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 50px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            animation: fadeIn 1.2s ease-out;
        }

        h1 {
            font-weight: 800;
            font-size: 3rem;
        }

        h1 span {
            color: #00c853;
        }

        .btn-pro {
            background: linear-gradient(135deg, #00c853, #00e676);
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px 40px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .btn-pro:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 200, 83, 0.4);
            color: white;
        }

        .btn-pro::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -100%;
            width: 100%;
            height: 200%;
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(45deg);
            transition: all 0.6s;
        }

        .btn-pro:hover::after {
            left: 120%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Smart<span>Plant</span></h1>
    <p class="mb-4">Tu gestor inteligente de plantas</p>
    <a href="/acceso" class="btn btn-pro btn-lg rounded-pill">
        Ingresar
    </a>
</div>

</body>
</html>
