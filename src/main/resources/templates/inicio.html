<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SmartPlant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <style>
        body{
            background-image: url("https://images.unsplash.com/photo-1636525653613-2a3a05c00759?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8cGxhbnQlMjB3YWxscGFwZXJ8ZW58MHx8MHx8fDA%3D");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            margin: 0;
            display:flex;
            justify-content:center;
            align-items:center;
            color: #ffffff;
            text-align:center;
        }
        .card{
            background:rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border-radius:20px;
            padding:40px;
            color: rgb(255, 255, 255);
        }
        .btn-pro{
            background: linear-gradient(50deg, #00c853, #ffffff);
            border: none;
            color: #0e0909;
        }
        .btn-pro:hover{
            transform: translateY(-3px);
            transition: 0.2s ease;
        }
    </style>

</head>
<body>

<div class="card">
    <h1>Bienvenido a SmartPlant</h1>
    <p>Tu gestor inteligente de plantas</p>

    <a href="/vista/registro" class="btn btn-pro btn-lg mt-3 rounded-pill">
        Ingresar
    </a>

</div>

</body>
</html>
