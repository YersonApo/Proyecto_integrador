<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Inicio de sesion</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <style>
        body {
            background-image: url("/img/fondo.jpg");
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            margin: 0;
            background-color: #2e7d32;
        }
        .card-i{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 5px solid rgb(14, 9, 9);
        }
        .card-divisor{
            background:rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border-radius:20px;
            padding:40px;
            color: rgb(14, 9, 9);
            text-align:center;
        }
        .card-linea{
            height: 2px;
            width: 500px;
            background-color: #0e0909;
            margin: 0 auto;
            opacity: 0.5;
        }
        .card-de{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-left: 5px solid rgb(14, 9, 9);
        }
        .btn-pro{
            background: linear-gradient(50deg, #00c853, #ffffff);
            border: none;
            color: #0e0909;
        }
        .btn-pro:hover{
            transform: translateY(-3px);
            transition: 0.2s ease;
        }


    </style>
</head>
<body>
<div class="container-fluid vh-100">
    <div class="row h-100">
        <div class="card-i col-md-6 vh-100">
            <div class="card-divisor">
            <h1>SmartPlant</h1>
                <div class="card-linea"></div>
            <p class="text-center mt-3">Tu espacio para registrar y cuidar tus plantas favoritas.</p>
            <img src="https://cdn-icons-png.freepik.com/256/6873/6873284.png?semt=ais_white_label"
            class="img-fluid "
            style="max-width: 100px;">
                <div><a th:href="@{/nuevousuario}" class="btn btn-pro rounded-pill mt-3">¡Registrate aqui!</a></div>
            </div>
        </div>
        <div class="card-de col-md-6 vh-100">
            <div class="card-divisor">
                <h1>Inicio de sesión</h1>

                <form th:action="@{/acceso}" method="post">

                    <div th:if="${error}" class="alert alert-danger p-2 small" th:text="${error}"></div>

                    <div class="mb-3 text-start">
                        <label class="form-label fw-semibold">Usuario</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>
                    <div class="mb-3 text-start">
                        <label class="form-label fw-semibold">Contraseña</label>
                        <input type="password" name="contra" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-pro w-100 py-2 fw-bold">
                        INGRESAR
                    </button>
                </form>

                <p class="mt-3 small">¿Olvidaste tu contraseña?</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
