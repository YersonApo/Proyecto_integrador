<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Menú Principal - SmartPlant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url("https://www.jogamarplantaornamental.com/wp-content/uploads/2019/06/fondo-plantas-jogamar-1024x683.jpg?v=1751364563");
            background-size: cover;
        }
        .card-divisor {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            color: rgb(14, 9, 9);
            text-align: center;
        }
        .card-linea {
            height: 2px;
            width: 60%;
            background-color: #0e0909;
            margin: 15px auto;
        }
        .btn-pro {
            background: linear-gradient(50deg, #00c853, #ffffff);
            border: none;
            color: #0e0909;
        }
        .btn-pro:hover {
            transform: translateY(-3px);
            transition: 0.2s ease;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row mb-5 justify-content-center">
        <div class="col-md-8">
            <div class="card-divisor">
                <h1 class="display-4 fw-bold">MENÚ PRINCIPAL</h1>
                <div class="card-linea"></div>
                <p>¡Bienvenido!</p>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-3">
            <div class="card-divisor h-100">
                <h3>Inventario</h3>
                <img src="https://cdn-icons-png.flaticon.com/512/1067/1067555.png" class="img-fluid my-3" style="max-width: 60px;">
                <a th:href="@{/vista/inventario}" class="btn btn-pro w-100 mt-2">Gestionar</a>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card-divisor h-100">
                <h4>Sistema de sugerencias</h4>
                <img src="https://cdn-icons-png.flaticon.com/512/5024/5024467.png" class="img-fluid my-3" style="max-width: 60px;">
                <a th:href="@{/vista/sugerencias}" class="btn btn-pro w-100 mt-2">Descubrir</a>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card-divisor h-100">
                <h3>Referencias</h3>
                <img src="https://cdn-icons-png.flaticon.com/512/3342/3342137.png" class="img-fluid my-3" style="max-width: 60px;">
                <a th:href="@{/vista/referencias}" class="btn btn-pro w-100 mt-2">Revisar</a>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card-divisor h-100">
                <h3>Cerrar sesión</h3>
                <img src="https://cdn-icons-png.flaticon.com/512/1828/1828427.png" class="img-fluid my-3" style="max-width: 60px;">
                <a th:href="@{/vista/registro}" class="btn btn-pro w-100 mt-4">¡Adios!</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
