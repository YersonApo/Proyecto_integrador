<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Ups! - SmartPlant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --primary-green: #00c853;
      --error-red: #ff1744;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: 'Poppins', sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)),
      url("/img/fondo.jpg");
      background-size: cover;
      background-position: center;
      z-index: -2;
    }

    .error-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 1s ease-out;
    }

    .visual-container {
      position: relative;
      width: 250px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 4px solid rgba(255, 255, 255, 0.05);
      border-top: 4px solid var(--primary-green);
      border-radius: 50%;
      animation: spin 2s linear infinite;
    }

    .icon-box {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: breathe 3s ease-in-out infinite;
    }

    .plant-icon {
      width: 120px;
      filter: drop-shadow(0 0 10px rgba(0, 200, 83, 0.2));
      opacity: 0.8;
    }

    .error-x {
      position: absolute;
      font-size: 100px;
      font-weight: 900;
      color: var(--error-red);
      text-shadow: 0 0 20px rgba(255, 23, 68, 0.8);
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .text-container {
      margin-top: 30px;
      text-align: center;
    }

    .error-title {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .error-msg {
      font-size: 1.1rem;
      opacity: 0.7;
      max-width: 400px;
      margin: 0 auto;
    }

    .btn-modern {
      margin-top: 35px;
      background: linear-gradient(45deg, var(--primary-green), #ffffff);
      border: none;
      padding: 12px 40px;
      border-radius: 50px;
      color: #000;
      font-weight: 800;
      text-decoration: none;
      text-transform: uppercase;
      transition: 0.3s ease;
      display: inline-block;
    }

    .btn-modern:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 10px 25px rgba(0, 200, 83, 0.5);
      color: #000;
    }


    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
  </style>
</head>
<body>

<div class="error-wrapper">
  <div class="visual-container">
    <div class="spinner-ring"></div>

    <div class="icon-box">
      <img src="https://cdn-icons-png.flaticon.com/512/628/628283.png" class="plant-icon">
      <div class="error-x">×</div>
    </div>
  </div>

  <div class="text-container">
    <h1 class="error-title">UPS, ALGO FALLÓ</h1>
    <p class="error-msg">
      No te preocupes, el jardín sigue a salvo. Vuelve a intentarlo o regresa al menú.
    </p>
    <a th:href="@{/vista/}" class="btn-modern">Regresar al Inicio</a>
  </div>
</div>

</body>
</html>
