<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PC de Plantas - SmartPlant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url("/img/fondo.jpg");
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            margin: 0;
            background-color: #2e7d32;
        }
        .card-divisor {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 15px;
            color: rgb(14, 9, 9);
            text-align: center;
            border: 3px solid rgb(14, 9, 9); /* Un poco más delgado para cuadros pequeños */
            transition: 0.2s;
            cursor: pointer;
            height: 100%;
        }
        .card-divisor:hover {
            background: rgba(0, 200, 83, 0.2);
            transform: scale(1.05);
        }
        .card-linea {
            height: 2px;
            width: 100%;
            background-color: #0e0909;
            margin: 8px 0;
            opacity: 0.3;
        }
        .btn-pro {
            background: linear-gradient(50deg, #00c853, #ffffff);
            border: 2px solid #0e0909;
            color: #0e0909;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="row mb-4">
        <div class="col-12">
            <div class="card-divisor py-3">
                <h2 class="m-0 text-uppercase fw-bold">Caja de Almacenamiento 1</h2>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-6 col-md-2" th:each="planta : ${plantas}">
            <div class="card-divisor"
                 th:title="'Familia: ' + ${planta.familia} + ' | Descripción: ' + ${planta.descripcion} + ' | Cuidados: ' + ${planta.cuidados}">

                <img src="https://cdn-icons-png.flaticon.com/512/628/628283.png" style="max-width: 45px;">
                <div class="card-linea"></div>
                <p class="mb-1 small fw-bold text-uppercase" th:text="${planta.nombre}">NOMBRE</p>
            </div>
        </div>
    </div>

        <div class="col-12 mt-5 text-center">
            <a th:href="@{/vista/inventario}" class="btn btn-pro px-5">SALIR DEL PC</a>
        </div>
    </div>
</div>
</body>
</html>
