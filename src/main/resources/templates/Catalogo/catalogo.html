<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo - SmartPlant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url("/img/fondo.jpg");
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            min-height: 100vh;
            background-color: #2e7d32;
            margin: 0;
        }
        .card-divisor {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 20px;
            color: #0e0909;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
            transition: 0.3s;
            cursor: pointer;
        }
        .card-divisor:hover {
            transform: scale(1.02);
            background: rgba(255,255,255,0.2);
        }
        .img-preview {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
        }
        .btn-pro {
            background: linear-gradient(50deg, #00c853, #ffffff);
            border: none;
            color: #0e0909;
            font-weight: bold;
        }
        .modal-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            color: #0e0909;
        }
        .almanaque-img {
            width: 100%;
            border-radius: 15px;
            border: 2px solid #00c853;
        }
        .info-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 15px;
            height: 100%;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding: 5px 0;
            font-weight: bold;
        }
        .stat-label { color: #1b5e20; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row mb-5 justify-content-center">
        <div class="col-md-8">
            <div class="card-divisor">
                <h1 class="display-5 fw-bold text-uppercase">Catalogo</h1>
                <a th:href="@{/menu}" class="text-dark text-decoration-none small fw-bold">← VOLVER</a>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-3" th:each="p : ${plantas}">
            <div class="card-divisor h-100" data-bs-toggle="modal" th:data-bs-target="'#m' + ${p.id}">
                <img th:src="${p.imagen}" class="img-preview mb-3">
                <h4 th:text="${p.nombre}">Nombre</h4>
                <button class="btn btn-pro w-100 mt-2">DETALLES</button>
            </div>

            <div class="modal fade" th:id="'m' + ${p.id}" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered modal-lg">
                    <div class="modal-content shadow-lg">
                        <div class="modal-header border-0">
                            <h2 class="modal-title fw-bold" th:text="${p.nombre}"></h2>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="row g-4">
                                <div class="col-md-5">
                                    <img th:src="${p.imagen}" class="almanaque-img shadow">
                                    <div class="mt-3 p-3 bg-white bg-opacity-25 rounded-3 text-center">
                                        <span class="fw-bold">Ambiente: </span>
                                        <span th:text="${p.ambiente == 1 ? 'Interior' : 'Exterior'}"></span>
                                    </div>
                                </div>
                                <div class="col-md-7">
                                    <div class="info-box shadow-sm">
                                        <p class="fst-italic" th:text="${p.descripcion}"></p>
                                        <hr>
                                        <div class="stat-row">
                                            <span class="stat-label">LUZ</span>
                                            <span th:text="${p.luz + '/5'}"></span>
                                        </div>
                                        <div class="stat-row">
                                            <span class="stat-label">RIEGO</span>
                                            <span th:text="${p.riego + '/5'}"></span>
                                        </div>
                                        <div class="stat-row">
                                            <span class="stat-label">TEMP</span>
                                            <span th:text="${p.temperatura + '°C'}"></span>
                                        </div>
                                        <div class="stat-row">
                                            <span class="stat-label">CUIDADO</span>
                                            <span th:text="${p.cuidado + '/5'}"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer border-0">
                            <button type="button" class="btn btn-pro px-5" data-bs-dismiss="modal">CERRAR</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
