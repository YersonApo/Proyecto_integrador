<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Sugerencias - SmartPlant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-image: url("/img/fondo.jpg");
      background-size: cover;
      background-position: center center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      min-height: 100vh;
      margin: 0;
      background-color: #2e7d32;
    }
    .card-divisor {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 50px;
      color: rgb(14, 9, 9);
      text-align: center;
      border: 5px solid rgb(14, 9, 9);
    }
    .card-linea {
      height: 2px;
      width: 80%;
      background-color: #0e0909;
      margin: 20px auto;
      opacity: 0.5;
    }
    .btn-pro {
      background: linear-gradient(50deg, #00c853, #ffffff);
      border: 3px solid #0e0909;
      color: #0e0909;
      font-weight: bold;
      text-decoration: none;
      padding: 15px 40px;
      display: inline-block;
      transition: 0.2s ease;
    }
    .btn-pro:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
<div class="container vh-100 d-flex justify-content-center align-items-center">
  <div class="row">
    <div class="col-md-12">
      <div class="card-divisor">
        <img src="https://usagif.com/wp-content/uploads/gif/thinking-emoji-17.gif" style="max-width: 80px;" class="mb-3">

        <h1 class="fw-bold">BIENVENIDO AL SISTEMA DE SUGERENCIAS</h1>
        <div class="card-linea"></div>

        <p class="fs-5 mt-4">
          A continuación, se le realizarán varias preguntas para darte una <br>
          <strong>planta recomendada</strong> según tus preferencias.
        </p>

        <div class="mt-5">
          <a th:href="@{/sugerencia}" class="btn btn-pro rounded-pill text-uppercase">
            Iniciar Test
          </a>
        </div>

        <div class="mt-3">
          <a th:href="@{/menu}" class="text-dark fw-bold text-decoration-none small">
            Volver al menú principal
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
